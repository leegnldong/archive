<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Archive</title>
<link rel="stylesheet" href="style.css?v=20261030-1">
</head>
<body>
<header class="bar">
  <a class="bar__name" href="index.html" data-hidden="true">Archive</a>
  <nav class="bar__links">
    <a href="https://www.instagram.com/" target="_blank" rel="noopener">@instagram_handle</a>
    <a href="card/index.html">카드</a>
    <a href="bread/index.html">빵 스티커</a>
    <a href="info.html">정보</a>
  </nav>
</header>

<section class="hero"><h1 class="hero__name">Archive</h1></section>

<nav class="filters" aria-label="구매 가능한 굿즈"></nav>
<div class="browse">
  <main class="grid"></main>
  <aside class="panel" hidden aria-label="선택한 게시물">
    <div class="panel__bar"><button type="button" class="pill panel__close">닫기 ×</button></div>
    <div class="panel__body"></div>
  </aside>
</div>

<script src="data.js?v=20261030-1"></script>
<script src="common.js?v=20261030-1"></script>
<script>
const grid = document.querySelector(".grid");
const tiles = POSTS.map(p => {
  const a = document.createElement("a");
  a.className = "tile"; a.href = `detail.html?id=${p.id}`; a.dataset.id = p.id; a.dataset.goods = isGoods(p) ? p.form : "";
  a.innerHTML = `${imgTag(p, p.title)}
    <span class="tile__cap">${p.title}, ${year(p.date)}</span>`;
  return a;
});

// 최신순이 왼쪽→오른쪽으로 읽히도록 가장 짧은 열에 차례로 넣는다
// 열 수는 그리드 폭으로 정한다(상세 패널이 열리면 줄어든다)
function layout() {
  const w = grid.clientWidth;
  const n = w >= 1100 ? 4 : w >= 640 ? 3 : 2;
  const cols = Array.from({ length: n }, () => Object.assign(document.createElement("div"), { className: "grid__col" }));
  const heights = new Array(n).fill(0);
  for (const t of tiles.filter(t => !t.hidden)) {
    const img = t.querySelector("img");
    const ratio = img.naturalWidth ? img.naturalHeight / img.naturalWidth : 1;
    const i = heights.indexOf(Math.min(...heights));
    cols[i].append(t); heights[i] += ratio;
  }
  grid.replaceChildren(...cols);
}
layout();
Promise.all(tiles.map(t => t.querySelector("img").decode().catch(() => {}))).then(layout);
addEventListener("resize", layout);

const ALL = "전체";
const filters = document.querySelector(".filters");
filters.innerHTML = [ALL, ...GOODS].map((g, i) =>
  `<button type="button" data-goods="${g}" aria-pressed="${i === 0}">${g}</button>`).join("");
filters.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  filters.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b));
  const g = b.dataset.goods;
  tiles.forEach(t => { t.hidden = g !== ALL && t.dataset.goods !== g; });
  layout();
});

// PC에서는 이미지를 누르면 화면을 나눠 오른쪽 패널에 상세를 연다. 휴대폰은 상세 페이지로 이동한다.
const wide = matchMedia("(min-width: 1024px)");
const panel = document.querySelector(".panel");
const panelBody = panel.querySelector(".panel__body");

let currentId = null;
function openPanel(id) {
  const p = byId[id]; if (!p) return;
  currentId = id;
  panelBody.innerHTML = renderDetail(p);
  initGalleries(panelBody);
  panel.hidden = false;
  panel.scrollTop = 0;
  tiles.forEach(t => t.toggleAttribute("aria-current", t.dataset.id === id));
  layout();
  tiles.find(t => t.dataset.id === id)?.scrollIntoView({ block: "nearest" });
  history.replaceState(null, "", `?p=${id}`);
}
function closePanel() {
  panel.hidden = true;
  tiles.forEach(t => t.removeAttribute("aria-current"));
  layout();
  history.replaceState(null, "", location.pathname);
}

grid.addEventListener("click", e => {
  const t = e.target.closest(".tile");
  if (!t || !wide.matches) return;
  e.preventDefault();
  openPanel(t.dataset.id);
});
panel.addEventListener("click", e => {
  if (e.target.closest(".panel__close")) return closePanel();
  const link = e.target.closest("a[data-id]");
  if (link) { e.preventDefault(); openPanel(link.dataset.id); return; }
  // 이미지 영역을 누르면 상세 페이지로 이동한다. ? 버튼, 썸네일, 사진을 끌어 넘긴 경우는 제외한다.
  const media = e.target.closest(".detail__media");
  if (!media || e.target.closest(".credit, .gallery__thumbs")) return;
  const g = media.querySelector(".gallery");
  if (g?.dataset.dragged) { delete g.dataset.dragged; return; }
  location.href = `detail.html?id=${currentId}`;
});
addEventListener("keydown", e => { if (e.key === "Escape" && !panel.hidden) closePanel(); });
wide.addEventListener("change", () => { if (!wide.matches && !panel.hidden) closePanel(); });

const initial = new URLSearchParams(location.search).get("p");
if (initial && wide.matches) openPanel(initial);

// 사이트 이름을 화면 폭에 맞추고, 큰 이름이 지나가면 상단 바 이름을 보인다
const hero = document.querySelector(".hero__name");
function fit() {
  hero.style.fontSize = "100px";
  const w = hero.parentElement.clientWidth - parseFloat(getComputedStyle(hero.parentElement).paddingLeft) * 2;
  hero.style.fontSize = (100 * w / hero.getBoundingClientRect().width) + "px";
}
document.fonts.ready.then(fit);
addEventListener("resize", fit);
const barName = document.querySelector(".bar__name");
const bar = document.querySelector(".bar");
const syncBarName = () => { barName.dataset.hidden = hero.getBoundingClientRect().bottom > bar.offsetHeight; };
addEventListener("scroll", syncBarName, { passive: true });
addEventListener("resize", syncBarName);
syncBarName();
</script>
</body>
</html>

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>빵의시간 카드</title>
<style>
  html, body { margin: 0; background: #14110e; }
  canvas { display: block; width: 100%; max-width: 1920px; height: auto; margin: 0 auto; }
  /* 장면(가운데 기준으로 양옆이 잘림) + 오른쪽 조정 패널(접으면 버튼만 떠 있음) */
  html, body { height: 100%; overflow: hidden; }
  body { display: flex; font: 15px/1.5 "Pretendard", "Malgun Gothic", sans-serif; }
  .stage { flex: 1; min-width: 0; height: 100%; background: #14110e; }
  .stage canvas { width: 100%; height: 100%; max-width: none; margin: 0; object-fit: cover; object-position: center; }
  .tool { flex: 0 0 320px; box-sizing: border-box; height: 100%; background: #f4f4f1; border-left: 1px solid #d9d9d4; color: #111; display: flex; flex-direction: column; transition: flex-basis .3s ease; overflow: hidden; }
  .tool__head { display: flex; align-items: center; justify-content: space-between; padding: 24px 24px 8px; }
  .back { display: inline-block; margin-bottom: 6px; color: #84847f; font-size: 13px; text-decoration: none; }
  .back:hover { color: #002fa7; }
  .tool__head h1 { margin: 0; font-size: 18px; font-weight: 700; white-space: nowrap; }
  .tool__body { flex: 1; overflow-y: auto; padding: 8px 24px 24px; display: flex; flex-direction: column; gap: 16px; }
  .tool__foot { padding: 16px 24px 24px; border-top: 1px solid #d9d9d4; display: grid; gap: 8px; background: #f4f4f1; }
  .tool canvas { width: 200px; height: 200px; margin: 0 auto; border-radius: 50%; transition: border-radius .2s; background: #e6e2da; cursor: grab; touch-action: none; }
  .tool canvas.square { border-radius: 10px; }
  .tool canvas:active { cursor: grabbing; }
  .hint { margin: -8px 0 0; color: #84847f; font-size: 12px; text-align: center; }
  .field { display: grid; gap: 4px; font-size: 13px; color: #555; }
  .field input[type=range] { width: 100%; accent-color: #002fa7; }
  .seg { display: grid; grid-template-columns: 1fr 1fr; padding: 3px; border-radius: 10px; background: #e6e2da; }
  .seg button { padding: 6px 0; border: 0; border-radius: 8px; background: transparent; color: #555; font: inherit; font-size: 13px; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: #fff; color: #111; box-shadow: 0 1px 3px rgba(0,0,0,.15); }
  /* 버튼 위계: 이미지 저장(주) > 영상 저장·공유(보조) > 이미지 올리기(보조) > 처음으로(텍스트) */
  .b { display: flex; align-items: center; justify-content: center; gap: 6px; border-radius: 10px; font: inherit; cursor: pointer; text-align: center; }
  .b--primary { padding: 14px 0; border: 0; background: #002fa7; color: #fff; font-size: 16px; font-weight: 700; }
  .b--primary:hover { background: #00268a; }
  .b--secondary { padding: 10px 0; border: 1px solid #c9c8c2; background: #fff; color: #111; font-size: 14px; }
  .b--secondary:hover { background: #ecebe6; }
  .b--secondary:disabled { color: #84847f; cursor: default; }
  .b--text { padding: 2px 0; border: 0; background: none; color: #84847f; font-size: 13px; text-decoration: underline; text-underline-offset: 3px; align-self: center; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .switch { display: flex; align-items: center; justify-content: space-between; font-size: 14px; cursor: pointer; padding-top: 12px; border-top: 1px solid #e3e2dc; }
  .switch input { appearance: none; width: 40px; height: 24px; border-radius: 999px; background: #c9c8c2; position: relative; cursor: pointer; transition: background .2s; margin: 0; }
  .switch input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: transform .2s; }
  .switch input:checked { background: #002fa7; }
  .switch input:checked::after { transform: translateX(16px); }
  .toast { position: fixed; left: 50%; bottom: 32px; transform: translateX(-50%); padding: 10px 16px; border-radius: 10px; background: rgba(17,17,17,.85); color: #fff; font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .2s; }
  .toast.on { opacity: 1; }
  .icon { flex: none; width: 36px; height: 36px; display: grid; place-items: center; border-radius: 10px; border: 1px solid #d9d9d4; background: #fff; color: #111; cursor: pointer; }
  .icon:hover { background: #ecebe6; }
  /* 접으면 패널은 사라지고 펼치기 버튼만 장면 위에 떠 있음 */
  body.folded .tool { flex-basis: 0; border: 0; }
  body.folded .icon { position: fixed; top: 20px; right: 20px; z-index: 3; width: 44px; height: 44px; border: 0; box-shadow: 0 4px 16px rgba(0,0,0,.22); }
  /* 휴대폰: 장면 위, 패널 아래 */
  @media (max-width: 700px) {
    body { flex-direction: column; }
    .stage { flex: 0 0 auto; height: 56vw; }
    .tool { flex: 1 1 auto; height: auto; border-left: 0; border-top: 1px solid #d9d9d4; }
    body.folded .tool { flex: 0 0 0; }
    body.folded .stage { flex: 1; height: auto; }
  }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo&display=swap" rel="stylesheet">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
} }
</script>
</head>
<body>

<main class="stage" id="stage"></main>
<aside class="tool" aria-label="머그 이미지 조정">
  <div class="tool__head">
    <div>
      <a class="back" href="../index.html">← 아카이브</a>
      <h1>머그 이미지</h1>
    </div>
    <button class="icon" id="fold" type="button" aria-label="패널 접기" aria-expanded="true">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="15" y1="4" x2="15" y2="20"/></svg>
    </button>
  </div>
  <div class="tool__body">
    <canvas id="pv" width="336" height="336" aria-label="머그 인쇄 미리보기"></canvas>
    <p class="hint">끌어서 위치, 휠로 크기 조정</p>
    <div class="seg" role="group" aria-label="인쇄 모양">
      <button type="button" data-shape="circle" aria-pressed="true">동그라미</button>
      <button type="button" data-shape="square" aria-pressed="false">네모</button>
    </div>
    <label class="b b--secondary">이미지 올리기<input id="file" type="file" accept="image/*" hidden></label>
    <label class="field">크기<input id="sc" type="range" min="0.5" max="3" step="0.01" value="1"></label>
    <label class="field">회전<input id="rt" type="range" min="-180" max="180" step="1" value="0"></label>
    <button class="b b--text" id="reset" type="button">위치·크기 처음으로</button>
    <label class="switch">확대해서 보기<input id="zoom" type="checkbox" role="switch"></label>
  </div>
  <div class="tool__foot">
    <button class="b b--primary" id="save" type="button">이미지 저장</button>
    <div class="row">
      <button class="b b--secondary" id="video" type="button">5초 영상 저장</button>
      <button class="b b--secondary" id="share" type="button">공유하기</button>
    </div>
  </div>
</aside>
<div class="toast" id="toast" role="status"></div>
<script type="module">
import * as THREE from "three";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
import { ShaderPass } from "three/addons/postprocessing/ShaderPass.js";
import { OutputPass } from "three/addons/postprocessing/OutputPass.js";
import { GTAOPass } from "three/addons/postprocessing/GTAOPass.js";

const W = 1920, H = 1080;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H, false);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.3;
document.getElementById("stage").appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(43, W / H, 0.1, 200);
camera.position.set(1.1, 1.92, 4.8);
// 위아래로 기울이지 않아 세로선(조명 줄·창틀)이 똑바로 서게 함
camera.lookAt(0.5, 1.92, 0);
// 위 7%, 아래 6%, 오른쪽 13%를 잘라 냄
camera.setViewOffset(W, H, 0, H * 0.07, W * 0.87, H * 0.87);

// 해 방향(장면 → 해): 창 오른쪽 위로 보이는 낮은 아침 해
const SUN_DIR = new THREE.Vector3(0.5, 0.26, -1).normalize();
const LIGHT_TRAVEL = SUN_DIR.clone().negate();

// 하늘·안개
const HORIZON = new THREE.Color("#cfe2ee");
function gradientTexture(stops, w = 4, h = 256) {
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  const g = c.getContext("2d"), lg = g.createLinearGradient(0, 0, 0, h);
  stops.forEach(([o, col]) => lg.addColorStop(o, col));
  g.fillStyle = lg; g.fillRect(0, 0, w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
scene.background = gradientTexture([[0, "#3f8fd2"], [0.45, "#7fbbe6"], [0.75, "#c4e0f2"], [1, "#cfe2ee"]]);
scene.fog = new THREE.Fog(HORIZON, 18, 120);

// 재질
const mat = (color, o = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.92, metalness: 0, flatShading: true, ...o });
const M = {
  wall: mat("#e8d8bf"), wallSide: mat("#dcc8a8"), ledge: mat("#f0e3cc"),
  wood: mat("#cbb491", { roughness: 0.8 }), woodDark: mat("#4b3222"),
  trunk: mat("#5a4030"), stripeDark: mat("#2e2824"), stripeLight: mat("#efe4cf"),
  pot: mat("#b9774c"), potRim: mat("#c98a5c"), soil: mat("#3d2c20"),
};

function box(w, h, d, m, x, y, z, { cast = true, receive = true } = {}) {
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m);
  mesh.position.set(x, y, z); mesh.castShadow = cast; mesh.receiveShadow = receive;
  scene.add(mesh); return mesh;
}

// 창이 있는 벽(두께 0.3, 안쪽 면 z=0), 개구부 x -1.7~3.1, y 0.95~2.85
const OX0 = -1.7, OX1 = 3.1, OY0 = 0.95, OY1 = 3.3;
box(7.1, 2.0, 0.3, M.wall, 1.45, -0.05, -0.15);
box(7.1, 1.8, 0.3, M.wall, 1.45, OY1 + 0.9, -0.15);
box(0.4, OY1 - OY0, 0.3, M.wall, -1.9, (OY0 + OY1) / 2, -0.15);
// 개구부 왼쪽 안쪽 면(벽과 돌출창 옆면 사이 틈을 막음)
box(0.08, OY1 - OY0 + 0.1, 0.36, M.wall, OX0 - 0.02, (OY0 + OY1) / 2, -0.16);
box(1.9, OY1 - OY0, 0.3, M.wall, 4.05, (OY0 + OY1) / 2, -0.15);
// 왼쪽 옆벽
box(0.2, 6, 7, M.wallSide, -2.2, 1.5, 3.2);

// 돌출창: 벽 바깥면(z=-0.3)에서 0.6 튀어나온 상자. 바닥은 실내 창턱과 이어짐
const BZ0 = -0.3, BZ1 = -0.9, BD = BZ0 - BZ1;
box(7.1, 0.12, 0.55 - BZ1, M.ledge, 1.45, OY0 - 0.06, (0.55 + BZ1) / 2);
// 창턱 아래는 앞면이 곧장 바닥까지 내려가는 막힌 벽체
box(7.1, OY0 - 0.12 + 1.2, 0.85, M.wall, 1.45, (OY0 - 0.12 - 1.2) / 2, 0.125);
box(OX1 - OX0 + 0.16, 0.1, BD + 0.04, M.wood, (OX0 + OX1) / 2, OY1 + 0.05, (BZ0 + BZ1) / 2 - 0.02);
box(OX1 - OX0 + 0.2, 0.08, 0.08, M.wood, (OX0 + OX1) / 2, OY1 + 0.08, BZ1 - 0.02);

// 창틀: 앞면 4칸 + 양 옆면 유리
const FZ = BZ1 + 0.04;
const glassMat = new THREE.MeshStandardMaterial({ color: "#fff6e2", transparent: true, opacity: 0.08, roughness: 0.7, metalness: 0, side: THREE.DoubleSide, depthWrite: false });
box(OX1 - OX0, 0.08, 0.1, M.wood, (OX0 + OX1) / 2, OY0 + 0.04, FZ);
box(OX1 - OX0, 0.08, 0.1, M.wood, (OX0 + OX1) / 2, OY1 - 0.04, FZ);
const MULLIONS = [OX0 + 0.04, -0.5, 1.9, OX1 - 0.04];
MULLIONS.forEach(x => box(0.08, OY1 - OY0, 0.1, M.wood, x, (OY0 + OY1) / 2, FZ));
for (const x of [OX0 + 0.04, OX1 - 0.04]) {
  box(0.08, 0.08, BD, M.wood, x, OY0 + 0.04, (BZ0 + BZ1) / 2);
  box(0.08, OY1 - OY0, 0.08, M.wood, x, (OY0 + OY1) / 2, BZ0 - 0.04);
  const side = new THREE.Mesh(new THREE.PlaneGeometry(BD, OY1 - OY0), glassMat);
  side.rotation.y = Math.PI / 2; side.position.set(x, (OY0 + OY1) / 2, (BZ0 + BZ1) / 2); scene.add(side);
}
const glass = new THREE.Mesh(new THREE.PlaneGeometry(1.9 - OX0, OY1 - OY0), glassMat);
glass.position.set((OX0 + 1.9) / 2, (OY0 + OY1) / 2, FZ); scene.add(glass);

// 오른쪽 칸: 바깥으로 열린 창
const sash = new THREE.Group();
sash.position.set(OX1 - 0.08, 0, FZ - 0.05);
const sw = 1.1, sh = OY1 - OY0 - 0.1, sy = (OY0 + OY1) / 2;
[[sw, 0.07, -sw / 2, sy - sh / 2], [sw, 0.07, -sw / 2, sy + sh / 2], [0.07, sh, -sw + 0.035, sy], [0.07, sh, -0.035, sy]]
  .forEach(([w, h, x, y]) => { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, 0.06), M.wood); m.position.set(x, y, 0); m.castShadow = true; sash.add(m); });
const sashGlass = new THREE.Mesh(new THREE.PlaneGeometry(sw, sh), glassMat.clone());
sashGlass.material.opacity = 0.14; sashGlass.position.set(-sw / 2, sy, 0); sash.add(sashGlass);
sash.rotation.y = THREE.MathUtils.degToRad(-58);
scene.add(sash);

// 차양: 돌출창 앞면과 양 옆면을 감싸는 둥근 천 차양, 회색·흰색 세로 줄무늬
const STRIPE = 0.4; // 회색+흰색 한 쌍의 폭
function stripeTexture(len) {
  const c = document.createElement("canvas"); c.width = 64; c.height = 4;
  const g = c.getContext("2d");
  g.fillStyle = "#f1ede3"; g.fillRect(0, 0, 64, 4);
  g.fillStyle = "#666a6c"; g.fillRect(0, 0, 32, 4);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = THREE.RepeatWrapping; t.anisotropy = 8; t.repeat.set(Math.max(1, Math.round(len / STRIPE)), 1); return t;
}
// 끝단: 부드럽게 오르내리는 물결 마감
function scallopTexture(len) {
  const c = document.createElement("canvas"); c.width = 128; c.height = 32;
  const g = c.getContext("2d");
  g.fillStyle = "#666a6c"; g.fillRect(0, 0, 64, 32);
  g.fillStyle = "#f1ede3"; g.fillRect(64, 0, 64, 32);
  // 아래쪽을 물결선으로 잘라냄(한 반복에 한 파장)
  g.globalCompositeOperation = "destination-out";
  g.beginPath(); g.moveTo(0, 32);
  for (let x = 0; x <= 128; x += 2) g.lineTo(x, 21 + 5 * Math.cos((x / 128) * Math.PI * 2 + Math.PI / 2));
  g.lineTo(128, 32); g.closePath(); g.fill();
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.wrapS = THREE.RepeatWrapping;
  t.repeat.set(Math.max(1, Math.round(len / STRIPE)), 1); return t;
}
const AZ = BZ1 - 0.05, AY = OY1 + 0.04, AH = 0.42, AD = 1.0, VH = 0.2;
const awProfile = a => [AD * Math.sin(a), AY + AH * Math.cos(a)]; // a=0 벽쪽 윗변, a=π/2 앞 끝
const clothMat = len => new THREE.MeshStandardMaterial({ map: stripeTexture(len), roughness: 0.95, side: THREE.DoubleSide });
const fringeMat = len => new THREE.MeshStandardMaterial({ map: scallopTexture(len), alphaTest: 0.5, roughness: 0.95, side: THREE.DoubleSide });
// 곧은 구간: 로컬 x를 따라 뻗고 로컬 -z 방향으로 볼록
function awningRun(len, x, z, yaw) {
  const g = new THREE.Group();
  const geo = new THREE.PlaneGeometry(len, 1, 1, 28), pos = geo.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const [out, y] = awProfile((1 - (pos.getY(i) + 0.5)) * Math.PI / 2);
    pos.setXYZ(i, pos.getX(i), y, -out);
  }
  geo.computeVertexNormals();
  g.add(new THREE.Mesh(geo, clothMat(len)));
  const fringe = new THREE.Mesh(new THREE.PlaneGeometry(len, VH), fringeMat(len));
  fringe.position.set(0, AY - VH / 2, -AD); g.add(fringe);
  g.position.set(x, 0, z); g.rotation.y = yaw; scene.add(g);
}
// 모서리: 같은 단면을 90도 돌린 면
function awningCorner(x, z, phiStart) {
  const arc = AD * Math.PI / 2, pts = [];
  for (let i = 0; i <= 14; i++) { const [out, y] = awProfile((i / 14) * Math.PI / 2); pts.push(new THREE.Vector2(Math.max(out, 0.001), y)); }
  const cloth = new THREE.Mesh(new THREE.LatheGeometry(pts, 12, phiStart, Math.PI / 2), clothMat(arc));
  cloth.position.set(x, 0, z); scene.add(cloth);
  const fringe = new THREE.Mesh(new THREE.CylinderGeometry(AD, AD, VH, 12, 1, true, phiStart, Math.PI / 2), fringeMat(arc));
  fringe.position.set(x, AY - VH / 2, z); scene.add(fringe);
}
const sideLen = BZ0 - AZ;
awningRun(OX1 - OX0, (OX0 + OX1) / 2, AZ, 0);
awningRun(sideLen, OX0, (BZ0 + AZ) / 2, Math.PI / 2);
awningRun(sideLen, OX1, (BZ0 + AZ) / 2, -Math.PI / 2);
awningCorner(OX0, AZ, Math.PI);
awningCorner(OX1, AZ, Math.PI / 2);

// 바깥 풍경: 로우폴리 나무·언덕
const GROUND_Y = -5;
const ground = new THREE.Mesh(new THREE.PlaneGeometry(600, 600), mat("#e6eaf1"));
ground.rotation.x = -Math.PI / 2; ground.position.y = GROUND_Y; ground.receiveShadow = true; scene.add(ground);

const greens = ["#7f9a4e", "#93a957", "#6f8a48", "#a6b462", "#86a05a"];
let seed = 11;
const rand = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const ORNAMENTS = ["#ffd27a", "#ff6a5a", "#fff1d6", "#ffb347"].map(c => new THREE.MeshBasicMaterial({ color: c }));
function roundTree(x, z, s, top) {
  pine(x, z, s * 0.9, top + s * 0.4, z > -10);
}
function _unusedRoundTree(x, z, s, top) {
  const g = new THREE.Group();
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.12 * s, 0.18 * s, top - GROUND_Y, 5), M.trunk);
  trunk.position.y = (top + GROUND_Y) / 2; g.add(trunk);
  const n = 2 + Math.floor(rand() * 2);
  for (let i = 0; i < n; i++) {
    const c = new THREE.Mesh(new THREE.IcosahedronGeometry(s * (0.8 + rand() * 0.4), 0), mat(greens[Math.floor(rand() * greens.length)]));
    c.position.set((rand() - 0.5) * s, top + (rand() - 0.2) * s * 0.6, (rand() - 0.5) * s);
    c.rotation.set(rand() * 3, rand() * 3, rand() * 3);
    c.castShadow = true; c.receiveShadow = true; g.add(c);
  }
  g.position.set(x, 0, z); scene.add(g);
}
const snowMat = mat("#f4f6fb", { emissive: "#c9d2e6", emissiveIntensity: 0.25 });
function pine(x, z, s, top, lit = false) {
  const g = new THREE.Group();
  const m = mat(rand() > 0.5 ? "#2f4a3a" : "#3a5643");
  for (let i = 0; i < 3; i++) {
    const r = s * (1 - i * 0.25), y = top - s * 1.6 + i * s * 0.75;
    const c = new THREE.Mesh(new THREE.ConeGeometry(r, s * 1.2, 6), m);
    c.position.y = y; c.castShadow = true; g.add(c);
    const cap = new THREE.Mesh(new THREE.ConeGeometry(r * 0.72, s * 0.62, 6), snowMat);
    cap.position.y = y + s * 0.3; g.add(cap);

function makeArt(h = 512) {

  g.fillStyle = "#f6efe4";

  g.fillStyle = "#1f5a3c";
  [[256, 150, 120], [256, 210, 150], [256, 275, 180]].forEach(([x, y, w]) => { g.beginPath(); g.moveTo(x, y + o - 70); g.lineTo(x + w / 2, y + o + 60); g.lineTo(x - w / 2, y + o + 60); g.fill(); });
  g.fillStyle = "#6b3f22"; g.fillRect(244, 335 + o, 24, 50);
  g.fillStyle = "#f2c14e"; g.beginPath();
  for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + (i * Math.PI) / 5, rr = i % 2 ? 11 : 26; g.lineTo(256 + Math.cos(a) * rr, 76 + o + Math.sin(a) * rr); }
  g.fill();

// 머그 옆 접시와 소금빵
{
  const plate = new THREE.Group();
  const prof = [[0, 0.006], [0.15, 0.008], [0.18, 0.012], [0.215, 0.026], [0.245, 0.034], [0.25, 0.03], [0.23, 0.012], [0.12, 0.0]];
  const dish = new THREE.Mesh(new THREE.LatheGeometry(prof.map(([x, y]) => new THREE.Vector2(x, y)), 40),
    new THREE.MeshStandardMaterial({ color: "#f4ecdc", roughness: 0.35, side: THREE.DoubleSide }));
  dish.castShadow = dish.receiveShadow = true; plate.add(dish);
  // 가장자리 갈색 두 줄
  const lineMat = new THREE.MeshStandardMaterial({ color: "#7a3a22", roughness: 0.5 });
  for (const [r, y] of [[0.238, 0.034], [0.172, 0.0115]]) {
    const ring = new THREE.Mesh(new THREE.TorusGeometry(r, 0.0035, 4, 64), lineMat);
    ring.rotation.x = Math.PI / 2; ring.position.y = y + 0.001; plate.add(ring);
  }
  // 소금빵: 길쭉한 삼각 반죽을 말아 초승달처럼 살짝 휜 롤. 층 없이 매끈하고, 말린 반죽 끝선이 비스듬한 나선 능선으로 보임
  const bread = new THREE.Group();
  const L = 0.19, R = 0.085, SY = 0.66, SZ = 1.0, BEND = 0.035;
  const rAt = x => R * Math.pow(Math.max(0, 1 - (x / L) ** 2), 0.62) + 0.01;
  const bend = x => -BEND * (x / L) ** 2; // 양 끝이 뒤로 휘는 초승달
  const breadProf = [];
  for (let i = 0; i <= 28; i++) { const x = -L + (2 * L * i) / 28; breadProf.push(new THREE.Vector2(rAt(x), x)); }
  const bodyGeo = new THREE.LatheGeometry(breadProf, 40);
  bodyGeo.rotateZ(-Math.PI / 2); bodyGeo.scale(1, SY, SZ);
  const top = new THREE.Color("#b06c2b"), side = new THREE.Color("#d29247"), tip = new THREE.Color("#e6b268"), bottom = new THREE.Color("#8a4a1a");
  const p = bodyGeo.attributes.position, cols = [];
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i); p.setZ(i, p.getZ(i) + bend(x));
    const up = THREE.MathUtils.clamp(p.getY(i) / (R * SY), -1, 1), end = Math.abs(x) / L;
    const c = side.clone().lerp(top, Math.max(0, up) * (1 - end)).lerp(tip, end ** 3 * 0.8).lerp(bottom, Math.max(0, -up - 0.55) * 1.6);
    cols.push(c.r, c.g, c.b);
  }
  bodyGeo.computeVertexNormals();
  bodyGeo.setAttribute("color", new THREE.Float32BufferAttribute(cols, 3));
  const crust = new THREE.Mesh(bodyGeo, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.62 }));
  crust.castShadow = true; bread.add(crust);
  // 말린 반죽 끝선: 몸통을 두 바퀴 반 감는 낮은 능선과 그 아래 가는 그늘
  const helix = (lift, turns) => {
    const pts = [];
    for (let i = 0; i <= 160; i++) {
      const t = i / 160, x = -L * 0.82 + t * L * 1.64, th = t * Math.PI * 2 * turns + 0.4, r = rAt(x) * lift;
      pts.push(new THREE.Vector3(x, r * SY * Math.cos(th), r * SZ * Math.sin(th) + bend(x)));
    }
    return new THREE.CatmullRomCurve3(pts);
  };
  const ridge = new THREE.Mesh(new THREE.TubeGeometry(helix(1.0, 2.5), 240, 0.0075, 6), new THREE.MeshStandardMaterial({ color: "#c98a42", roughness: 0.6 }));
  const groove = new THREE.Mesh(new THREE.TubeGeometry(helix(0.985, 2.5), 240, 0.004, 4), new THREE.MeshStandardMaterial({ color: "#7a3f14", roughness: 0.8 }));
  groove.position.x = 0.007; bread.add(ridge, groove);
  // 굵은 소금 알갱이
  const saltMat = new THREE.MeshStandardMaterial({ color: "#ffffff", roughness: 0.25, emissive: "#ffffff", emissiveIntensity: 0.2 });
  [[-0.09, 0.15], [-0.04, -0.3], [0.0, 0.2], [0.04, -0.08], [0.08, 0.32], [0.11, -0.22], [-0.06, 0.45]].forEach(([x, th], i) => {
    const r = rAt(x) * 1.02;
    const s = new THREE.Mesh(new THREE.BoxGeometry(0.01, 0.006, 0.008), saltMat);
    s.position.set(x, r * SY * Math.cos(th) + 0.003, r * SZ * Math.sin(th) + bend(x)); s.rotation.set(i, i * 2, 0); bread.add(s);
  });
  bread.position.y = 0.012 + R * SY * 0.92; bread.rotation.y = 0.55; plate.add(bread);
  plate.position.set(0.48, OY0, 0.24); plate.scale.setScalar(1.6);
  scene.add(plate);
  contact(0.48, 0.22, 0.46);
}

function stocking(color, s = 1) {
  const g = new THREE.Group();
  const sh = new THREE.Shape();
  sh.moveTo(0, 0); sh.lineTo(0.1, 0); sh.lineTo(0.1, -0.15);
  sh.quadraticCurveTo(0.1, -0.19, 0.15, -0.2); sh.quadraticCurveTo(0.2, -0.21, 0.19, -0.26);
  sh.quadraticCurveTo(0.17, -0.3, 0.07, -0.29); sh.quadraticCurveTo(0, -0.28, 0, -0.2); sh.lineTo(0, 0);
  const body = new THREE.Mesh(new THREE.ExtrudeGeometry(sh, { depth: 0.025, bevelEnabled: true, bevelSize: 0.008, bevelThickness: 0.008, bevelSegments: 2 }),
    new THREE.MeshStandardMaterial({ color, roughness: 0.85 }));
  body.castShadow = true; g.add(body);
  const cuff = new THREE.Mesh(new THREE.BoxGeometry(0.13, 0.05, 0.05), new THREE.MeshStandardMaterial({ color: "#f7f3ec", roughness: 1 }));
  cuff.position.set(0.05, -0.01, 0.0125); g.add(cuff);
  const loop = new THREE.Mesh(new THREE.TorusGeometry(0.014, 0.003, 4, 10), new THREE.MeshStandardMaterial({ color: "#7a3a22" }));
  loop.position.set(0.0, 0.03, 0.0125); g.add(loop);
  g.scale.setScalar(s); return g;
}

{

  }

    const a = (i / 9) * Math.PI * 2 + 0.3;
    const b = new THREE.Mesh(new THREE.SphereGeometry(0.022, 8, 6), i % 3 ? red : gold);
    b.position.set(Math.cos(a) * 0.2, Math.sin(a) * 0.2, 0.05); wreath.add(b);
  }
  for (const s of [-1, 1]) {
    const loop = new THREE.Mesh(new THREE.ConeGeometry(0.05, 0.1, 4), red);
    loop.rotation.z = s * Math.PI / 2; loop.position.set(s * 0.05, -0.2, 0.07); wreath.add(loop);
    const tail = new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.12, 0.01), red);
    tail.rotation.z = s * 0.35; tail.position.set(s * 0.03, -0.29, 0.07); wreath.add(tail);
  }
  const knot = new THREE.Mesh(new THREE.SphereGeometry(0.024, 8, 6), red); knot.position.set(0, -0.2, 0.08); wreath.add(knot);
  const ribbon = new THREE.Mesh(new THREE.BoxGeometry(0.02, OY1 - 2.72 - 0.22, 0.005), red);
  ribbon.position.set(0, 0.22 + (OY1 - 2.72 - 0.22) / 2, 0); wreath.add(ribbon);
  wreath.position.set(1.3, 2.72, FZ + 0.08); wreath.scale.setScalar(1.2);
  wreath.traverse(o => { if (o.isMesh) o.castShadow = true; });
  scene.add(wreath);

  // 창턱 작은 트리: 머그와 책 사이
  const tree = new THREE.Group();
  const stand = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.08, 0.1, 8), red); stand.position.y = 0.05; tree.add(stand);
  const tiers = [[0.2, 0.26, 0.24], [0.155, 0.22, 0.4], [0.105, 0.18, 0.54]];
  tiers.forEach(([r, h, y], i) => {
    const c = new THREE.Mesh(new THREE.ConeGeometry(r, h, 8), greensX[i % 3]); c.position.y = y; c.castShadow = true; tree.add(c);
  });
  const star = new THREE.Mesh(new THREE.OctahedronGeometry(0.04, 0), new THREE.MeshBasicMaterial({ color: "#ffe08a" }));
  star.position.y = 0.66; star.scale.set(1, 1.2, 0.5); tree.add(star);
  const lightsX = ["#ffe2a6", "#ff7a6a", "#fff3d6", "#ffd27a"].map(c => new THREE.MeshBasicMaterial({ color: c }));
  for (let i = 0; i < 22; i++) {
    const hh = i / 22, a = i * 2.4, y = 0.14 + hh * 0.48, r = 0.19 * (1 - hh * 0.75);
    const b = new THREE.Mesh(new THREE.SphereGeometry(0.011, 6, 4), lightsX[i % 4]);
    b.position.set(Math.cos(a) * r, y, Math.sin(a) * r); tree.add(b);
  }
  for (let i = 0; i < 7; i++) {
    const hh = (i + 0.5) / 7, a = i * 1.9 + 1, r = 0.18 * (1 - hh * 0.75);
    const o = new THREE.Mesh(new THREE.SphereGeometry(0.02, 8, 6), i % 2 ? red : gold);
    o.position.set(Math.cos(a) * r, 0.16 + hh * 0.44, Math.sin(a) * r); tree.add(o);
  }
  tree.position.set(2.14, OY0, 0.18); scene.add(tree);
  const tl = new THREE.PointLight("#ffc27a", 0.6, 1.2, 2); tl.position.set(2.14, OY0 + 0.4, 0.4); tl.userData.glow = 0.6; scene.add(tl);
  contact(2.14, 0.18, 0.3);
}

  const g = c.getContext("2d"), rg = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  rg.addColorStop(0, "rgba(255,245,220,1)"); rg.addColorStop(1, "rgba(255,245,220,0)");
  g.fillStyle = rg; g.fillRect(0, 0, 64, 64); return new THREE.CanvasTexture(c);
})();

  const s = new THREE.Vector3(-0.5 + rand() * 3.2, 1.0 + rand() * 1.7, -0.1).addScaledVector(LIGHT_TRAVEL, t);
  dustPos.push(s.x, s.y, s.z);
}

  const sw = logoImg.width, sh = logoImg.height, src = document.createElement("canvas");
  src.width = sw; src.height = sh;
  const sg = src.getContext("2d"); sg.drawImage(logoImg, 0, 0);
  const d = sg.getImageData(0, 0, sw, sh), px = d.data;
  // 가장 밝은 값(배경)과 가장 어두운 값(획) 사이로 투명도를 정함
  let lo = 255, hi = 0;
  for (let i = 0; i < px.length; i += 4) { const l = (px[i] + px[i + 1] + px[i + 2]) / 3; lo = Math.min(lo, l); hi = Math.max(hi, l); }
  for (let i = 0; i < px.length; i += 4) {
    const lum = (px[i] + px[i + 1] + px[i + 2]) / 3;
    const a = Math.max(0, Math.min(1, ((hi - 18) - lum) / ((hi - lo) * 0.55)));
    px[i] = 255; px[i + 1] = 247; px[i + 2] = 230; px[i + 3] = a * 255;
  }

composer.addPass(new OutputPass());
composer.addPass(new ShaderPass({
  uniforms: { tDiffuse: { value: null }, tCap: { value: capTex }, uTime: { value: 0 }, uCapX: { value: 0.5 } },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.); }`,
  fragmentShader: `uniform sampler2D tDiffuse; uniform sampler2D tCap; uniform float uTime; uniform float uCapX; varying vec2 vUv;
    float hash(vec2 p){ return fract(sin(dot(p, vec2(12.9898,78.233)) + uTime) * 43758.5453); }
    void main(){
      vec3 c = texture2D(tDiffuse, vUv).rgb;
      // 어두운 곳은 따뜻한 갈색, 밝은 곳은 크림색으로
      vec3 shadowTint = vec3(0.10, 0.06, 0.05), lightTint = vec3(1.0, 0.97, 0.90);
      c = mix(shadowTint, lightTint, c) * 0.18 + c * 0.82;
      float d = distance(vUv, vec2(0.58, 0.32));
      c *= mix(1.0, 0.86, smoothstep(0.35, 0.95, d));
      c += (hash(vUv * 1000.) - 0.5) * 0.035;
      vec2 capUv = vec2(vUv.x - (uCapX - 0.5), (vUv.y * 1080. + 46.) / 200.);
      if (capUv.y > 0. && capUv.y < 1.) { vec4 cap = texture2D(tCap, capUv); c = mix(c, cap.rgb, cap.a); }
      gl_FragColor = vec4(c, 1.);
    }`,
}));

// 움직임: 매 프레임 다시 그림
const postPass = composer.passes[composer.passes.length - 1];
const clock = new THREE.Clock();
// 먼지: 원래 자리를 기준으로 천천히 떠다님
const dustArr = dustGeo.attributes.position.array, dustBase = dustArr.slice();
// 전구: 같은 재질끼리 묶여 조금씩 다른 박자로 깜빡임
const twinkle = [];
// 전구마다 재질을 따로 두어 각자 다른 색·밝기·박자로 반짝임
const bulbColors = ["#ffd27a", "#ff8a6a", "#fff1d0", "#ffb3c8", "#c8f0a8", "#a8d8ff"];
scene.traverse(o => {
  if (o.isMesh && o.material && o.material.isMeshBasicMaterial && o.geometry.type === "SphereGeometry") {
    o.material = o.material.clone();
    const pick = () => new THREE.Color(bulbColors[Math.floor(Math.random() * bulbColors.length)]);
    twinkle.push({ m: o.material, base: pick(), alt: pick(), phase: Math.random() * 100, speed: 0.6 + Math.random() * 1.8, hue: 0.15 + Math.random() * 0.4 });
  }
});
// 바람에 가지에서 털려 날리는 눈가루
const flakeN = 70, flakeArr = new Float32Array(flakeN * 3), flakeSpeed = new Float32Array(flakeN);
const spawnFlake = (i, anyHeight) => {
  const tip = twigTips[Math.floor(Math.random() * twigTips.length)].p;
  flakeArr[i * 3] = tip.x + (Math.random() - 0.5) * 0.3;
  flakeArr[i * 3 + 1] = anyHeight ? 0.6 + Math.random() * 2.2 : tip.y;
  flakeArr[i * 3 + 2] = tip.z + (Math.random() - 0.5) * 0.3;
  flakeSpeed[i] = 0.12 + Math.random() * 0.2;
};
for (let i = 0; i < flakeN; i++) spawnFlake(i, true);
const flakeGeo = new THREE.BufferGeometry(); flakeGeo.setAttribute("position", new THREE.BufferAttribute(flakeArr, 3));
scene.add(new THREE.Points(flakeGeo, new THREE.PointsMaterial({ size: 0.03, map: dustTex, color: "#ffffff", transparent: true, depthWrite: false, opacity: 0.95 })));
// 창밖 함박눈: 둥근 눈송이가 앞뒤 여러 겹으로 흔들리며 내림
const snowN = 1800, snowArr = new Float32Array(snowN * 3), snowSeed = new Float32Array(snowN);
const snowRange = { x0: -6, x1: 8, y0: -3, y1: 4.6 };
for (let i = 0; i < snowN; i++) {
  snowArr[i * 3] = snowRange.x0 + Math.random() * (snowRange.x1 - snowRange.x0);
  snowArr[i * 3 + 1] = snowRange.y0 + Math.random() * (snowRange.y1 - snowRange.y0);
  snowArr[i * 3 + 2] = -1.2 - Math.pow(Math.random(), 1.6) * 16;
  snowSeed[i] = Math.random();
}
const snowTex = (() => {
  const c = document.createElement("canvas"); c.width = c.height = 64;
  const g = c.getContext("2d"), rg = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  rg.addColorStop(0, "rgba(255,255,255,1)"); rg.addColorStop(0.55, "rgba(255,255,255,.95)"); rg.addColorStop(1, "rgba(255,255,255,0)");
  g.fillStyle = rg; g.fillRect(0, 0, 64, 64); return new THREE.CanvasTexture(c);
})();
const snowGeo = new THREE.BufferGeometry(); snowGeo.setAttribute("position", new THREE.BufferAttribute(snowArr, 3));
scene.add(new THREE.Points(snowGeo, new THREE.PointsMaterial({ size: 0.15, map: snowTex, color: "#ffffff", transparent: true, depthWrite: false, opacity: 1 })));
// 확대해서 보기: 빵과 머그 쪽으로 카메라가 다가감(0 전체, 1 확대)
const zoom = { v: 0, to: 0, from: 0, start: 0,
  fromPos: camera.position.clone(), fromLook: new THREE.Vector3(0.5, 1.92, 0),
  toPos: new THREE.Vector3(0.95, 1.7, 2.45), toLook: new THREE.Vector3(0.8, 1.42, 0.15) };
const ease = x => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
// 화분·미니 트리 전구가 비추는 빛: 밝기와 색이 잔잔하게 바뀜
const glows = [];
scene.traverse(o => { if (o.isPointLight && o.userData.glow) glows.push({ l: o, base: o.color.clone(), alt: new THREE.Color(glows.length ? "#ffb0a0" : "#d6f0b0"), phase: glows.length * 2.4 }); });
// 빵 접시와 머그의 가운데 지점
const FOCUS = new THREE.Vector3(0.78, OY0 + 0.1, 0.22), focusPt = new THREE.Vector3();
const sunBase = SUN_DIR.clone();
let last = 0;
function tick() {
  const t = clock.getElapsedTime(), dt = Math.min(0.05, t - last); last = t;
  // 바람: 잔잔한 흔들림 위에 7초마다 짧은 돌풍
  const gust = Math.pow(Math.max(0, Math.sin(t * Math.PI * 2 / 7)), 6);
  branchGroup.rotation.z = Math.sin(t * 0.9) * 0.002 + Math.sin(t * 2.3) * 0.001 + gust * 0.011 * Math.sin(t * 5.5);
  branchGroup.rotation.x = gust * 0.005 * Math.sin(t * 4.3);
  // 먼지
  for (let i = 0; i < dustArr.length; i += 3) {
    const k = i / 3;
    dustArr[i] = dustBase[i] + Math.sin(t * 0.21 + k * 1.3) * 0.05 + gust * 0.03;
    dustArr[i + 1] = dustBase[i + 1] + Math.sin(t * 0.27 + k * 2.1) * 0.06;
    dustArr[i + 2] = dustBase[i + 2] + Math.cos(t * 0.19 + k * 0.7) * 0.04;
  }
  dustGeo.attributes.position.needsUpdate = true;
  // 눈가루: 천천히 떨어지고 돌풍이 불면 옆으로 날림
  for (let i = 0; i < flakeN; i++) {
    flakeArr[i * 3] += Math.sin(t * 0.4 + i) * 0.03 * dt;
    flakeArr[i * 3 + 1] -= flakeSpeed[i] * dt;
    flakeArr[i * 3 + 2] += Math.sin(t + i) * 0.01 * dt;
    if (flakeArr[i * 3 + 1] < 0.4 || flakeArr[i * 3] > 3.6) spawnFlake(i, false);
  }
  flakeGeo.attributes.position.needsUpdate = true;
  for (let i = 0; i < snowN; i++) {
    const k = snowSeed[i];
    snowArr[i * 3 + 1] -= (0.16 + k * 0.12) * dt;
    snowArr[i * 3] += Math.sin(t * (0.35 + k * 0.25) + k * 20) * 0.05 * dt;
    if (snowArr[i * 3 + 1] < snowRange.y0) { snowArr[i * 3 + 1] = snowRange.y1; snowArr[i * 3] = snowRange.x0 + Math.random() * (snowRange.x1 - snowRange.x0); }
    if (snowArr[i * 3] > snowRange.x1) snowArr[i * 3] = snowRange.x0;
  }
  snowGeo.attributes.position.needsUpdate = true;
  // 햇살: 아주 천천히 방향이 바뀌어 그림자와 빛줄기가 미세하게 움직임
  const sd = sunBase.clone().applyAxisAngle(new THREE.Vector3(0, 1, 0), Math.sin(t * 0.12) * 0.035);
  sun.position.copy(sunTarget.position).addScaledVector(sd, 20);
  // 전구 깜빡임
  for (const g of glows) {
    g.l.intensity = g.l.userData.glow * (0.55 + 0.9 * (0.5 + 0.5 * Math.sin(t * 1.3 + g.phase)));
    g.l.color.copy(g.base).lerp(g.alt, 0.5 + 0.5 * Math.sin(t * 0.5 + g.phase));
  }
  for (const tw of twinkle) tw.m.color.copy(tw.base).lerp(tw.alt, 0.5 + 0.5 * Math.sin(t * tw.hue + tw.phase)).multiplyScalar(0.35 + 0.65 * Math.pow(0.5 + 0.5 * Math.sin(t * tw.speed + tw.phase * 1.3), 2));
  const zp = Math.min(1, (performance.now() - zoom.start) / 1600);
  zoom.v = zoom.from + (zoom.to - zoom.from) * zp;
  const z = ease(zoom.v);
  camera.position.lerpVectors(zoom.fromPos, zoom.toPos, z);
  camera.lookAt(new THREE.Vector3().lerpVectors(zoom.fromLook, zoom.toLook, z));
  // 화면이 좁아 양옆이 잘릴 때 빵과 머그 사이가 가운데에 오도록 자르는 위치를 맞춤
  focusPt.copy(FOCUS).project(camera);
  const cv = renderer.domElement, cw = cv.clientWidth, ch = cv.clientHeight, k = Math.max(cw / W, ch / H);
  const fx = ((focusPt.x + 1) / 2) * W * k, left = Math.min(0, Math.max(cw - W * k, cw / 2 - fx));
  cv.style.objectPosition = left + "px 50%";
  // 로고도 같은 지점 아래에 오도록
  postPass.uniforms.uCapX.value = (focusPt.x + 1) / 2;
  postPass.uniforms.uTime.value = t;
  composer.render();
  window.__ready = true;
  requestAnimationFrame(tick);
}
tick();

// 머그 이미지 조정 패널
{
  const $ = id => document.getElementById(id);
  const pv = $("pv"), pg = pv.getContext("2d");
  const showPreview = () => { pg.clearRect(0, 0, pv.width, pv.height); pg.drawImage(printCanvas, 0, 0, pv.width, pv.height); };
  const update = () => { drawPrint(); showPreview(); };
  const syncInputs = () => { $("sc").value = printState.s; $("rt").value = Math.round((printState.r * 180) / Math.PI); };
  update();
  $("fold").addEventListener("click", () => {
    const folded = document.body.classList.toggle("folded");
    $("fold").setAttribute("aria-label", folded ? "패널 펼치기" : "패널 접기");
    $("fold").setAttribute("aria-expanded", String(!folded));
  });
  const toast = msg => { const t = $("toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("on"), 2600); };
  const download = (blob, name) => { const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); };
  const snapshot = () => new Promise(r => renderer.domElement.toBlob(r, "image/png"));
  $("save").addEventListener("click", async () => { download(await snapshot(), "bread-time-card.png"); toast("이미지를 저장했습니다"); });
  $("share").addEventListener("click", async () => {
    const file = new File([await snapshot()], "bread-time-card.png", { type: "image/png" });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: "빵의시간" }); } catch (e) { /* 공유 창을 닫은 경우 */ }
    } else { download(file, file.name); toast("이 브라우저는 바로 공유를 지원하지 않아 이미지로 저장했습니다"); }
  });
  $("video").addEventListener("click", () => {
    const btn = $("video");
    if (btn.disabled) return;
    const type = ["video/mp4;codecs=avc1", "video/mp4", "video/webm;codecs=vp9", "video/webm"].find(t => MediaRecorder.isTypeSupported(t));
    const rec = new MediaRecorder(renderer.domElement.captureStream(30), { mimeType: type, videoBitsPerSecond: 8e6 });
    const chunks = [];
    rec.ondataavailable = e => e.data.size && chunks.push(e.data);
    rec.onstop = () => {
      download(new Blob(chunks, { type }), "bread-time-card." + (type.startsWith("video/mp4") ? "mp4" : "webm"));
      btn.disabled = false; btn.textContent = "5초 영상 저장"; toast("영상을 저장했습니다");
    };
    btn.disabled = true; let left = 5; btn.textContent = `녹화 중 ${left}초`;
    const timer = setInterval(() => { left--; if (left > 0) btn.textContent = `녹화 중 ${left}초`; else clearInterval(timer); }, 1000);
    rec.start(); setTimeout(() => rec.stop(), 5000);
  });
  document.querySelectorAll(".seg button").forEach(b => b.addEventListener("click", () => {
    printState.shape = b.dataset.shape;
    document.querySelectorAll(".seg button").forEach(o => o.setAttribute("aria-pressed", String(o === b)));
    pv.classList.toggle("square", printState.shape === "square");
    update();
  }));
  $("zoom").addEventListener("change", e => { zoom.from = zoom.v; zoom.to = e.target.checked ? 1 : 0; zoom.start = performance.now(); });
  $("file").addEventListener("change", e => {
    const f = e.target.files[0]; if (!f) return;
    const img = new Image();
    img.onload = () => { Object.assign(printState, { img, x: 0, y: 0, s: 1, r: 0, rim: false }); drawFrame(img); syncInputs(); update(); };
    img.src = URL.createObjectURL(f);
  });
  $("sc").addEventListener("input", e => { printState.s = +e.target.value; update(); });
  $("rt").addEventListener("input", e => { printState.r = (+e.target.value * Math.PI) / 180; update(); });
  $("reset").addEventListener("click", () => { Object.assign(printState, { x: 0, y: 0, s: 1, r: 0 }); syncInputs(); update(); });
  // 미리보기를 끌어 위치 이동, 휠로 크기 조정
  let drag = null;
  pv.addEventListener("pointerdown", e => { drag = { x: e.clientX, y: e.clientY, ox: printState.x, oy: printState.y }; pv.setPointerCapture(e.pointerId); });
  pv.addEventListener("pointermove", e => {
    if (!drag) return;
    const r = pv.getBoundingClientRect().width / 2;
    printState.x = drag.ox + (e.clientX - drag.x) / r; printState.y = drag.oy + (e.clientY - drag.y) / r; update();
  });
  pv.addEventListener("pointerup", () => { drag = null; });
  pv.addEventListener("wheel", e => { e.preventDefault(); printState.s = Math.min(3, Math.max(0.5, printState.s * (e.deltaY < 0 ? 1.05 : 0.95))); syncInputs(); update(); }, { passive: false });
}

</script>
</body>
